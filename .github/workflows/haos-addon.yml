name: Home Assistant add-on
on:
  push:
    paths: ['suslik-addon/**', 'repository.json', '.github/workflows/haos-addon.yml']
  pull_request:
    paths: ['suslik-addon/**', 'repository.json', '.github/workflows/haos-addon.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s suslik-addon/tests -p 'test_*.py' -v
      - run: python -m pip install PyYAML==6.0.3
      - run: python suslik-addon/tests/validate_metadata.py
      - uses: frenck/action-addon-linter@v2.21.0
        with:
          path: ./suslik-addon
  build-and-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker build --platform linux/amd64 -t suslik-addon:test suslik-addon
      - run: python suslik-addon/tests/smoke.py
